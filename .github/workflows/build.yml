name: build-and-publish

# Thin caller: the actual build/publish/sign/scan logic lives in the shared
# PCOM-CICD reusable pipeline. This repository only supplies the image inputs.
#
# Built for linux/amd64 only: kubectl is fetched for the amd64 architecture.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Weekly rebuild so the image picks up fresh base + tooling security updates.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # cosign keyless signing
  security-events: write # SARIF upload to the Security tab

jobs:
  pipeline:
    uses: NNP-Platform-Components-PCOM/PCOM-CICD/.github/workflows/container-pipeline.yml@main
    secrets: inherit
    with:
      image-name: pcom-brc-postgres-backup
      image-version: "16"
      platforms: linux/amd64
